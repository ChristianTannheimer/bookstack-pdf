services:
  bookstack:
    # Fertiges Image aus GitHub Actions. Lokal bauen: build: . ergaenzen.
    image: ghcr.io/christiantannheimer/bookstack-pdf:${IMAGE_TAG:-latest}
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      bookstack_db:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Europe/Vienna
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_HOST: bookstack_db
      DB_PORT: 3306
      DB_DATABASE: bookstack
      DB_USER: bookstack
      DB_PASS: ${DB_PASS}
      # Registrierung aus - Konten legst du selbst an
      APP_REGISTRATION_ENABLED: "false"
      # Mail fuer Einladungen und Passwort-Reset (Hetzner, wie bei Vaultwarden)
      MAIL_DRIVER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: tls
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: "EBT Dokumentation"
    volumes:
      - ./config:/config
      # Init-Skript traegt EXPORT_PDF_COMMAND in /config/www/.env nach
      - ./custom-cont-init.d:/custom-cont-init.d:ro
    ports:
      # NUR auf localhost - Caddy terminiert TLS davor.
      # Ohne die 127.0.0.1-Bindung ist BookStack am Reverse Proxy vorbei erreichbar.
      - "127.0.0.1:6875:80"
    networks:
      - bookstack_net
      - caddy_net

  bookstack_db:
    image: mariadb:11
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: Europe/Vienna
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - bookstack_net

networks:
  bookstack_net:
    internal: true
  caddy_net:
    external: true
